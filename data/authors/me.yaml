bio: 'I am a postdoctoral fellow at the TIFR Centre for Applicable Mathematics, working
  with Prof. Praveen Chandrashekar. My research focuses on the numerical analysis
  of partial differential equations, with particular interests in finite element and
  discontinuous Galerkin methods.


  I received my Ph.D. from IIT Goa in 2025 under the supervision of Prof. Saumya Bajpai.
  Before joining TIFR CAM, I worked with Prof. Amiya Kumar Pani as a research associate
  at BITS Goa.'
